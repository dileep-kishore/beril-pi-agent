[project]
name = "beril-cli"
version = "0.2.1"
description = "BERIL Pi workbench — bundled `beril` CLI (execution substrate for the Pi extensions)"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pyyaml>=6", "nbformat>=5"]

[project.scripts]
beril = "beril_cli.cli:main"

[dependency-groups]
# nbconvert/jupyter-client/ipykernel let the notebook-execution path be tested
# against the current interpreter; production execution uses the .venv-berdl jupyter.
test = ["pytest>=8", "nbconvert>=7", "jupyter-client>=8", "ipykernel>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Only the CLI package is built into the wheel; scripts/ and tools/ are standalone
# (invoked via `uv run`/subprocess), resolved relative to the workspace root at runtime.
[tool.hatch.build.targets.wheel]
packages = ["beril_cli"]
